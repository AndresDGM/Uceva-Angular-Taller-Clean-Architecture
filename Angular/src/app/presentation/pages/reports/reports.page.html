@switch (state) {
  @case ('loading') {
    <app-alert alertState="loading" text="Cargando Reportes..."></app-alert>
  }

  @case ('error') {
    <app-alert alertState="error" text="Error al Cargar los Reportes"></app-alert>
  }

  @case ('success') {
    <app-reports-table [reports]="reports"></app-reports-table>
  }
}
